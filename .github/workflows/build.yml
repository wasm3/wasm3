name: build

on:
  push:
    branches:
    - "**"
    tags:
    - "v*.*.*"
    # Note: path filters are not evaluated for tag pushes, so a release always builds
    paths-ignore: ['**.md', '**.svg', '**.png']
  pull_request:
    paths-ignore: ['**.md', '**.svg', '**.png']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    name: linux-${{ matrix.config.target }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        config:
        - {target: clang,             cc: clang,      }
        - {target: clang-x86,         cc: clang,      cflags: -m32,   install: "gcc-multilib"   }
        - {target: gcc,               cc: gcc,        }
        #- {target: gcc-x86,           cc: gcc,        flags: "-m32",  install: "gcc-multilib"   } # TODO: fails on numeric operations
        # Builds without uvwasi
        - {target: gcc-no-uvwasi,     cc: gcc,    flags: -DBUILD_WASI=simple   }
        - {target: clang-no-uvwasi,   cc: clang,  flags: -DBUILD_WASI=simple   }
        # Debug builds
        - {target: gcc-debug,               cc: gcc,    flags: -DCMAKE_BUILD_TYPE=Debug                         }
        - {target: clang-no-uvwasi-debug,   cc: clang,  flags: -DCMAKE_BUILD_TYPE=Debug -DBUILD_WASI=simple     }
        # GCC 16.2 build (static, linked against musl)
        - {target: gcc-musl,          install: gcc-musl,   ldflags: "-static -s", artifact: wasm3-gcc-linux-x64 }
        # Clang builds (static, linked against musl)
        - {target: clang-musl,        install: clang-musl, ldflags: "-static -s", artifact: wasm3-linux-x64 }
        - {target: clang-musl-strace, install: clang-musl, ldflags: "-static -s", artifact: wasm3-strace-linux-x64, notest: true, cflags: "-DDEBUG -Dd_m3EnableStrace=2 -Dd_m3RecordBacktraces=1" }

    steps:
    - uses: actions/checkout@v7

    - name: Install ${{ matrix.config.install }} toolchain
      if: ${{ matrix.config.install }}
      env:
        GCC_MUSL_URL:   https://github.com/prepkg/gcc-toolchain/releases/download/1.0.0-beta/gcc-x86_64-linux-musl.tar.gz
        CLANG_MUSL_URL: https://github.com/cross-tools/clang-cross/releases/download/20260430/x86_64-unknown-linux-musl.tar.xz
      run: |
        mkdir -p .toolchains
        if [ "${{ matrix.config.install }}" = "gcc-musl" ]; then
          wget -qO- ${GCC_MUSL_URL} | tar xz -C .toolchains
          echo "TOOLCHAIN_ARGS=-DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/.toolchains/x86_64-linux-musl/toolchain.cmake" >> $GITHUB_ENV
        elif [ "${{ matrix.config.install }}" = "clang-musl" ]; then
          wget -qO- ${CLANG_MUSL_URL} | tar xJ -C .toolchains
          echo "TOOLCHAIN_ARGS=-DCMAKE_C_COMPILER=${GITHUB_WORKSPACE}/.toolchains/x86_64-unknown-linux-musl/bin/x86_64-unknown-linux-musl-clang" >> $GITHUB_ENV
        else
          sudo apt update
          sudo apt install -y ${{ matrix.config.install }}
        fi
    - name: Configure
      env:
        CC: ${{ matrix.config.cc }}
        CFLAGS: -Dd_m3HasTypedRefs=1 ${{ matrix.config.cflags }}
        LDFLAGS: ${{ matrix.config.ldflags }}
      run: |
        mkdir build
        cd build
        cmake ${TOOLCHAIN_ARGS} ${{ matrix.config.flags }} ..
    - name: Build
      run: |
        cmake --build build
        ./build/wasm3 --version
    - name: Prepare artifact
      if: ${{ matrix.config.artifact }}
      run: cp ./build/wasm3 ./${{ matrix.config.artifact }}.elf
    - name: Upload artifact
      if: ${{ matrix.config.artifact }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.config.artifact }}
        path: ./${{ matrix.config.artifact }}.elf
        if-no-files-found: error
    - name: Test regression cases
      if: ${{ !matrix.config.notest }}
      run: cd test && python3 run-regression-test.py
    - name: Test WebAssembly spec
      if: ${{ !matrix.config.notest }}
      run: cd test && python3 run-spec-test.py
    - name: Test previous WebAssembly spec versions
      if: ${{ !matrix.config.notest }}
      run: |
        cd test
        python3 run-spec-test.py --spec=v1.1
        python3 run-spec-test.py --spec=opam-1.1.1
        python3 run-spec-test.py --spec=wg-2.0
    - name: Test WASI apps
      if: ${{ !matrix.config.notest }}
      run: cd test && python3 run-wasi-test.py

  alpine-multiarch:
    runs-on: ubuntu-latest
    name: alpine-${{ matrix.arch }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64 ]  # TODO: s390x, ppc64le, arm64v8

    steps:
    - uses: actions/checkout@v7
    - name: Setup multiarch/qemu-user-static
      if: matrix.arch != 'amd64'
      run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    - name: Run tests
      run: |
        docker run --rm -i                                          \
          --volume="${{ github.workspace }}:/work" --workdir=/work  \
          ${{ matrix.arch }}/alpine:3.24 sh -s <<'EOF'
        set -e
        apk add --no-cache build-base cmake python3 git linux-headers
        echo "------------ Build Wasm3 ------------"
        mkdir build && cd build && cmake .. && cd ..
        cmake --build build
        echo "------------ Test i32 const ------------"
        echo AGFzbQEAAAAGBgF/AEElCwcLAQdteWNvbnN0AwAACARuYW1lAgEA | base64 -d > myconst.wasm
        echo ':get-global myconst' | ./build/wasm3 --repl myconst.wasm
        echo ':get-global myconst' | ./build/wasm3 --repl myconst.wasm 2>&1 | grep 37
        echo "------------ Run tests ------------"
        cd test && python3 run-regression-test.py && cd ..
        cd test && python3 run-spec-test.py && cd ..
        cd test && python3 run-wasi-test.py --fast && cd ..
        echo "-------- All tests finished -------"
        EOF

  macos:
    runs-on: macos-latest
    name: macos-${{ matrix.config.target }}
    timeout-minutes: 10

    env:
      CFLAGS: -Dd_m3HasTypedRefs=1

    strategy:
      fail-fast: false
      matrix:
        config:
        - {target: uvwasi,      }
        - {target: no-uvwasi,   flags: -DBUILD_WASI=simple   }

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake ${{ matrix.config.flags }} ..
    - name: Build
      run: |
        cmake --build build
    - name: Test regression cases
      run: cd test && python3 run-regression-test.py
    - name: Test WebAssembly spec
      run: cd test && python3 run-spec-test.py
    - name: Test previous WebAssembly spec versions
      run: |
        cd test
        python3 run-spec-test.py --spec=v1.1
        python3 run-spec-test.py --spec=opam-1.1.1
        python3 run-spec-test.py --spec=wg-2.0
    - name: Test WASI apps
      run: cd test && python3 run-wasi-test.py

  windows:
    runs-on: windows-latest
    name: windows-${{ matrix.config.target }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        config:
        - {target: clang-x64,   platform: "-A x64",     toolset: "-T ClangCL",  ldflags: -s,  artifact: wasm3-win-x64   }
        - {target: msvc-x64,    platform: "-A x64",     toolset: ""             }
        - {target: clang-x86,   platform: "-A Win32",   toolset: "-T ClangCL",  ldflags: -s,  artifact: wasm3-win-x86   }
        - {target: msvc-x86,    platform: "-A Win32",   toolset: ""             }
        # Builds without uvwasi
        - {target: clang-x64-no-uvwasi,   platform: "-A x64",     toolset: "-T ClangCL",  flags: "-DBUILD_WASI=simple"   }
        - {target: msvc-x64-no-uvwasi,    platform: "-A x64",     toolset: "",            flags: "-DBUILD_WASI=simple"   }
        - {target: clang-x86-no-uvwasi,   platform: "-A Win32",   toolset: "-T ClangCL",  flags: "-DBUILD_WASI=simple"   }
        - {target: msvc-x86-no-uvwasi,    platform: "-A Win32",   toolset: "",            flags: "-DBUILD_WASI=simple"   }
        # Release build with strace
        - {target: clang-x64-strace,      platform: "-A x64",     toolset: "-T ClangCL",  ldflags: -s,  artifact: wasm3-strace-win-x64, notest: true, cflags: "-DDEBUG -Dd_m3EnableStrace=2 -Dd_m3RecordBacktraces=1" }

    defaults:
      run:
        shell: cmd

    steps:
    - uses: actions/checkout@v7
    - name: Configure
      env:
        CFLAGS: -Dd_m3HasTypedRefs=1 ${{ matrix.config.cflags }}
        LDFLAGS: ${{ matrix.config.ldflags }}
      run: |
        mkdir build
        cd build
        cmake ${{ matrix.config.platform }} ${{ matrix.config.toolset }} ${{ matrix.config.flags }} ..
    - name: Build
      run: |
        cmake --build build --config Release
        cp ./build/Release/wasm3.exe ./build/
    - name: Prepare artifact
      if: ${{ matrix.config.artifact }}
      run: cp ./build/Release/wasm3.exe ./${{ matrix.config.artifact }}.exe
    - name: Upload artifact
      if: ${{ matrix.config.artifact }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.config.artifact }}
        path: ./${{ matrix.config.artifact }}.exe
        if-no-files-found: error
    - name: Test regression cases
      if: ${{ !matrix.config.notest }}
      run: |
        cd test
        python run-regression-test.py
    - name: Test WebAssembly spec
      if: ${{ !matrix.config.notest }}
      run: |
        cd test
        python run-spec-test.py
    - name: Test previous WebAssembly spec versions
      if: ${{ !matrix.config.notest }}
      run: |
        cd test
        python run-spec-test.py --spec=v1.1
        python run-spec-test.py --spec=opam-1.1.1
        python run-spec-test.py --spec=wg-2.0
    - name: Test WASI apps
      if: ${{ !matrix.config.notest }}
      run: |
        cd test
        python run-wasi-test.py

  cygwin-build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Set up Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
            packages: make gcc-g++ cmake
      - run: cd $GITHUB_WORKSPACE && cmake -DBUILD_WASI=simple . && make
        shell: C:\tools\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'

  wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CFLAGS: -Dd_m3HasTypedRefs=1

    steps:
    - uses: actions/checkout@v7
    - name: Setup environment
      env:
        # v33.0 miscompiles something that makes the self-hosted smallpt test
        # trap and then corrupt the host heap; 25 is the newest that's clean
        WASI_VERSION: 25
        WASI_VERSION_FULL: "25.0"
      run: |
        echo "WASI_VERSION=${WASI_VERSION}" >> $GITHUB_ENV
        echo "WASI_VERSION_FULL=${WASI_VERSION_FULL}" >> $GITHUB_ENV
        echo "WASI_SDK_PATH=${GITHUB_WORKSPACE}/.toolchains/wasi-sdk-${WASI_VERSION_FULL}-x86_64-linux" >> $GITHUB_ENV
    - name: Install WASI SDK
      run: |
        mkdir -p .toolchains
        cd .toolchains
        WASI_TAR=wasi-sdk-${WASI_VERSION_FULL}-x86_64-linux.tar.gz
        wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/${WASI_TAR}
        tar xf ${WASI_TAR}
    # The Wasm build emits tail calls, so it needs a host that supports the proposal.
    # Wasmtime enables it by default; Wasmer needs --enable-tail-call and, as of 7.x,
    # can no longer open the test files through a preopened directory.
    - name: Install Wasmtime
      run: curl https://wasmtime.dev/install.sh -sSf | bash
    - name: Configure
      run: |
        mkdir build-wasi
        cd build-wasi
        cmake -DCMAKE_TOOLCHAIN_FILE="${WASI_SDK_PATH}/share/cmake/wasi-sdk.cmake" -DWASI_SDK_PREFIX="${WASI_SDK_PATH}" ..
    - name: Build
      run: |
        cmake --build build-wasi
        cp ./build-wasi/wasm3.wasm ./test/
        cp ./build-wasi/wasm3.wasm ./wasm3-wasi.wasm
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm3-wasi
        path: ./wasm3-wasi.wasm
        if-no-files-found: error
    # max-wasm-stack is raised so that Wasm3's own stack limit is what a runaway guest
    # hits first -- the same reason the self-hosting steps below pass --stack-size
    - name: Test WebAssembly spec (in Wasmtime)
      run: |
        export PATH="$HOME/.wasmtime/bin:$PATH"
        cd test
        python3 run-spec-test.py --exec "wasmtime run -W max-wasm-stack=4194304 --dir ./::./ wasm3.wasm --spec-repl"
    - name: Test WASI apps (in Wasmtime)
      run: |
        export PATH="$HOME/.wasmtime/bin:$PATH"
        cd test
        python3 run-wasi-test.py --exec "wasmtime run -W max-wasm-stack=4194304 --dir ./::./ wasm3.wasm" --fast

    # Clang, because the guest here is wasm3.wasm itself: it's full of return_call, and
    # replaying those iteratively needs a host built with musttail
    - name: Configure (native)
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_C_COMPILER=clang ..
    - name: Build (native)
      run: |
        cmake --build build
    - name: Test WebAssembly spec (in Wasm3, self-hosting)
      run: |
        cd test
        python3 run-spec-test.py --exec "../build/wasm3 --stack-size 2097152 wasm3.wasm --spec-repl"
    - name: Test WASI apps (in Wasm3, self-hosting)
      run: |
        cd test
        python3 run-wasi-test.py --fast --exec "../build/wasm3 --stack-size 2097152 wasm3.wasm"

    - name: Configure, Build wasm3-strace
      env:
        CFLAGS: -Dd_m3HasTypedRefs=1 -DDEBUG -Dd_m3EnableStrace=2 -Dd_m3RecordBacktraces=1
      run: |
        mkdir build-strace
        cd build-strace
        cmake -DCMAKE_TOOLCHAIN_FILE="${WASI_SDK_PATH}/share/cmake/wasi-sdk.cmake" -DWASI_SDK_PREFIX="${WASI_SDK_PATH}" ..
        cmake --build .
        cp ./wasm3.wasm ../wasm3-strace.wasm
    - name: Upload artifact (strace)
      uses: actions/upload-artifact@v7
      with:
        name: wasm3-strace-wasi
        path: ./wasm3-strace.wasm
        if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Show selected Xcode
      run: |
        xcodebuild -version
        xcode-select -p
        ls /Applications | grep Xcode
    - name: Build
      run: |
        cd platforms/ios
        xcodebuild build -scheme wasm3 -project wasm3.xcodeproj -configuration Release -destination "generic/platform=iOS Simulator"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Build
      run: |
        cd platforms/android
        ./gradlew build
    - name: Copy
      run: |
        cp ./platforms/android/app/build/outputs/apk/debug/app-debug.apk ./wasm3-android-coremark.apk
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm3-android-coremark
        path: ./wasm3-android-coremark.apk
        if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: wasm3
    - name: Checkout pywasm3
      uses: actions/checkout@v7
      with:
        repository: wasm3/pywasm3
        path: pywasm3
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Update and Build Python module
      run: |
        rm -rf ./pywasm3/wasm3
        cp -r wasm3/source ./pywasm3/wasm3
        pip install ./pywasm3
    - name: Install WABT
      run: |
        sudo apt update
        sudo apt install wabt
    - name: Test
      run: |
        pip install pytest
        cd ./pywasm3
        pytest

  cosmopolitan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    # The cosmocc toolchain is itself made of APE binaries, so teach the kernel
    # how to run them before building
    - name: Register APE interpreter
      run: sudo sh -c "echo ':APE:M::MZqFpD::/bin/sh:' >/proc/sys/fs/binfmt_misc/register"
    - name: Build αcτµαlly pδrταblε εxεcµταblε
      run: |
        cd platforms/cosmopolitan
        ./build.sh
        cp ./wasm3.com ../../wasm3-cosmopolitan.com
        cp ./wasm3.com.dbg ../../wasm3-cosmopolitan.com.dbg
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm3-cosmopolitan
        path: |
          ./wasm3-cosmopolitan.com
          ./wasm3-cosmopolitan.com.dbg
        if-no-files-found: error
    - name: Install Wine64
      run: |
        sudo apt update
        sudo apt install wine64
        wine --version
    - name: Prepare tests
      run: |
        cd test
        cp ../platforms/cosmopolitan/wasm3.com ./wasm3-lin.com
        cp ../platforms/cosmopolitan/wasm3.com ./wasm3-win.com
        echo "------------ wasm3-lin.com ------------"
        ./wasm3-lin.com --version
        echo "------------ wasm3-win.com (in Wine) ------------"
        wine ./wasm3-win.com --version
    - name: Test WebAssembly spec
      run: |
        cd test
        python3 run-spec-test.py --exec "./wasm3-lin.com --spec-repl"
    - name: Test WASI apps
      run: |
        cd test
        python3 run-wasi-test.py --fast --exec "./wasm3-lin.com"

    - name: Test WebAssembly spec (in Wine)
      run: |
        cd test
        python3 run-spec-test.py --exec "wine ./wasm3-win.com --spec-repl"
    - name: Test WASI apps (in Wine)
      run: |
        cd test
        python3 run-wasi-test.py --fast --exec "wine ./wasm3-win.com"

  cross-qemu:
    runs-on: ubuntu-latest
    name: cross-qemu-${{ matrix.config.target }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        config:
        #- {target: i386,    toolchain: gcc-multilib,              cc: clang -m32,                 qemu: qemu-i386-static    }
        - {target: arm,     toolchain: gcc-arm-linux-gnueabi,     cc: arm-linux-gnueabi-gcc,      qemu: qemu-arm-static     }
        - {target: armhf,   toolchain: gcc-arm-linux-gnueabihf,   cc: arm-linux-gnueabihf-gcc,    qemu: qemu-arm-static     }
        - {target: aarch64, toolchain: gcc-aarch64-linux-gnu,     cc: aarch64-linux-gnu-gcc,      qemu: qemu-aarch64-static }
        - {target: riscv64, toolchain: gcc-riscv64-linux-gnu,     cc: riscv64-linux-gnu-gcc,      qemu: qemu-riscv64-static }
        - {target: ppc,     toolchain: gcc-powerpc-linux-gnu,     cc: powerpc-linux-gnu-gcc,      qemu: qemu-ppc-static     }
        - {target: ppc64,   toolchain: gcc-powerpc64-linux-gnu,   cc: powerpc64-linux-gnu-gcc,    qemu: qemu-ppc64-static   }
        #- {target: ppc64le, toolchain: gcc-powerpc64le-linux-gnu, cc: powerpc64le-linux-gnu-gcc,  qemu: qemu-ppc64le-static }
        - {target: s390x,   toolchain: gcc-s390x-linux-gnu,       cc: s390x-linux-gnu-gcc,        qemu: qemu-s390x-static   }
        - {target: mips,    toolchain: gcc-mips-linux-gnu,          cc: mips-linux-gnu-gcc,         qemu: qemu-mips-static     }
        - {target: mips64,  toolchain: gcc-mips64-linux-gnuabi64,   cc: mips64-linux-gnuabi64-gcc,  qemu: qemu-mips64-static   }
        - {target: mipsel,  toolchain: gcc-mipsel-linux-gnu,        cc: mipsel-linux-gnu-gcc,       qemu: qemu-mipsel-static   }
        - {target: mips64el,toolchain: gcc-mips64el-linux-gnuabi64, cc: mips64el-linux-gnuabi64-gcc,qemu: qemu-mips64el-static }
        - {target: alpha,   toolchain: gcc-alpha-linux-gnu,       cc: alpha-linux-gnu-gcc,        qemu: qemu-alpha-static   }
        # TODO: - {target: sparc64, toolchain: gcc-sparc64-linux-gnu,     cc: sparc64-linux-gnu-gcc,      qemu: qemu-sparc64-static, skip_wasi: true }

        #- {target: i386 (u64 slots),    toolchain: gcc-multilib,              cc: clang -m32,                 qemu: qemu-i386-static,     cflags: -Dd_m3Use32BitSlots=0  }
        - {target: arm (u64 slots),     toolchain: gcc-arm-linux-gnueabi,     cc: arm-linux-gnueabi-gcc,      qemu: qemu-arm-static,      cflags: -Dd_m3Use32BitSlots=0  }
        - {target: aarch64 (u64 slots), toolchain: gcc-aarch64-linux-gnu,     cc: aarch64-linux-gnu-gcc,      qemu: qemu-aarch64-static,  cflags: -Dd_m3Use32BitSlots=0  }
        - {target: ppc (u64 slots),     toolchain: gcc-powerpc-linux-gnu,     cc: powerpc-linux-gnu-gcc,      qemu: qemu-ppc-static,      cflags: -Dd_m3Use32BitSlots=0  }
        - {target: ppc64 (u64 slots),   toolchain: gcc-powerpc64-linux-gnu,   cc: powerpc64-linux-gnu-gcc,    qemu: qemu-ppc64-static,    cflags: -Dd_m3Use32BitSlots=0  }

    steps:
    - uses: actions/checkout@v7
    - name: Install QEMU
      run: |
        sudo apt update
        sudo apt install qemu-user-static
    - name: Install ${{ matrix.config.toolchain }}
      run: |
        sudo apt install ${{ matrix.config.toolchain }}
    - name: Build
      run: |
        mkdir build
        cd build
        ${{ matrix.config.cc }} -DASSERTS -Dd_m3HasWASI ${{ matrix.config.cflags }} \
            -I../source ../source/*.c ../platforms/app/main.c \
            -O3 -g0 -flto -lm -static \
            -o wasm3
    - name: Test WebAssembly spec
      run: |
        cd test
        python3 run-spec-test.py --exec "${{ matrix.config.qemu }} ../build/wasm3 --spec-repl"
    - name: Test WASI apps
      if: ${{ !matrix.config.skip_wasi }}
      run: |
        cd test
        python3 run-wasi-test.py --fast --exec "${{ matrix.config.qemu }} ../build/wasm3"

  platformio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    # TODO:
    #- name: Build AVR ATmega1284
    #  run: |
    #    cd platforms/embedded/arduino
    #    pio run -e mega1284
    #    ! nm .pio/build/mega1284/firmware.elf | grep printf
    - name: Build ESP8266
      run: |
        cd platforms/embedded/esp8266
        pio run
    # TODO:
    #- name: Build ESP32
    #  run: |
    #    cd platforms/embedded/esp32-pio
    #    pio run

  platformio-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio
    - name: Build Arduino MKR1000
      run: |
        cd platforms/embedded/arduino
        pio run -e mkr1000
    # TODO:
    #- name: Build Blue Pill (JeeH)
    #  run: |
    #    cd platforms/embedded/bluepill
    #    pio run
    - name: Build TinyBLE
      run: |
        cd platforms/embedded/arduino
        pio run -e tinyBLE
    - name: Build MXChip AZ3166
      run: |
        cd platforms/embedded/arduino
        pio run -e az3166

  platformio-riscv:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio
    - name: Build HiFive1
      run: |
        cd platforms/embedded/hifive1
        pio run
    - name: Build Sipeed MAIX
      run: |
        cd platforms/embedded/arduino
        pio run -e maix

  particle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "github.event_name == 'push'"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Particle CLI
      run: sudo npm install -g particle-cli
    - name: Log in
      env:
        PARTICLE_TOKEN: ${{ secrets.PARTICLE_TOKEN }}
      run: particle login --token $PARTICLE_TOKEN
    - name: Build Photon
      run: |
        cd platforms/embedded/particle
        particle compile --followSymlinks photon
        particle compile --followSymlinks argon

  esp-idf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Check that IDF and PIO examples are in sync
      run: |
        diff -q platforms/embedded/esp32-idf/main/main.cpp platforms/embedded/esp32-pio/src/main.cpp
      # TODO: also check that the build flags are in sync
    - name: Build for ESP32
      run: |
        docker run --rm -i                                          \
          --volume="${{ github.workspace }}:/work" --workdir=/work  \
          espressif/idf:release-v5.4 bash -s <<'EOF'
        set -e
        source /opt/esp/idf/export.sh
        echo "------------ Build Wasm3 ------------"
        cd platforms/embedded/esp32-idf
        export EXTRA_CFLAGS="-Werror"
        idf.py set-target esp32
        idf.py -D CONFIG_ESPTOOLPY_FLASHFREQ_80M=y    \
              -D CONFIG_ESPTOOLPY_FLASHFREQ=\"80m\"   \
              -D CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y     \
              -D CONFIG_ESPTOOLPY_FLASHSIZE=\"4MB\"   \
              build
        idf.py merge-bin -o flash-image.bin --fill-flash-size 4MB
        chmod -R a+rX build
        echo "------------ Build OK ---------------"
        EOF
    - name: Check flash image
      run: |
        cp platforms/embedded/esp32-idf/build/flash-image.bin .
        head -c 128 flash-image.bin | hexdump -C
        md5sum flash-image.bin
    - name: Run in QEMU
      uses: tobozo/esp32-qemu-sim@v2.1.0
      with:
        chip: esp32
        flash-image: flash-image.bin
        qemu-timeout: "60"
        timeout-interrupt-regex: "Restarting..."
    - name: Validate output
      run: |
        grep "Result: 46368" logs.txt
        grep "Elapsed: " logs.txt
        grep "Restarting..." logs.txt
      # test $(($(grep "ets Jul 29 2019" logs.txt | wc -l))) -eq 1

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cd platforms/cpp
          mkdir build
          cd build
          cmake ..
      - name: Build
        run: |
          cd platforms/cpp
          cmake --build build
      - name: Run
        run: |
          cd platforms/cpp/build
          ./wasm3_cpp_example

  as-cpp:
    name: maintenance (build as C++)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        mkdir build
        cd build
        clang -xc++ -Dd_m3HasWASI \
            -I../source ../source/*.c ../platforms/app/main.c \
            -O3 -g0 -lm \
            -o wasm3
    - name: Test
      run: ./build/wasm3 ./test/wasi/simple/test.wasm

  with-logs:
    name: maintenance (debug logs)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        mkdir build
        cd build
        clang -xc++ -Dd_m3HasWASI -DDEBUG \
            -Dd_m3EnableOpTracing=1     \
            -Dd_m3EnableStrace=1        \
            -Dd_m3LogParse=1            \
            -Dd_m3LogModule=1           \
            -Dd_m3LogCompile=1          \
            -Dd_m3LogWasmStack=1        \
            -Dd_m3LogEmit=1             \
            -Dd_m3LogCodePages=1        \
            -Dd_m3LogRuntime=1          \
            -Dd_m3LogNativeStack=1      \
            -Dd_m3RecordBacktraces=1    \
            -I../source ../source/*.c ../platforms/app/main.c \
            -O3 -g0 -lm \
            -o wasm3
    - name: Test
      run: ./build/wasm3 ./test/wasi/simple/test.wasm > /dev/null

  preprocessed-ops:
    name: maintenance (preprocess ops)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Install sponge
      run: |
        sudo apt update
        sudo apt install moreutils
    - name: Build
      run: |
        make -f extra/utils.mk preprocess
        mkdir build
        cd build
        gcc -Dd_m3HasWASI \
            -I../source ../source/*.c ../platforms/app/main.c \
            -O3 -g0 -lm \
            -o wasm3
    - name: Test
      run: ./build/wasm3 ./test/wasi/simple/test.wasm

  spellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install codespell
      run: |
        pip install codespell
    - name: Spellcheck
      run: |
        codespell

  #
  # Cross-compiled release builds. Kept separate: build-cross.py drives its own
  # toolchain matrix, and these binaries are not exercised here (see cross-qemu).
  #

  dist-linux-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Build for all targets
      run: |
        python3 build-cross.py --notest --nowasi
        cd build-cross
        tar -czvf ../wasm3-linux-other.tar.gz wasm3-linux-*

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wasm3-linux-other
        path: wasm3-linux-other.tar.gz
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - linux
      - macos
      - windows
      - wasi
      - cosmopolitan
      - android
      - dist-linux-cross

    permissions:
      contents: write

    env:
      draft: true

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          find dist -type f -maxdepth 2 -print

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ env.draft }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
